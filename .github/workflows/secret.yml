name: Secrets Demo

on: workflow_dispatch

jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Use the secret in a step
        env:
          API_KEY: ${{ secrets.MY_API_KEY }}
        run: |
          echo "Length of secret: ${#API_KEY}"
          curl -s -o /dev/null -w "%{http_code}\n" https://httpbin.org/headers -H "Authorization: Bearer $API_KEY"                                     